<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029" />
      <stop offset="100%" stop-color="#111216" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <radialGradient id="irisCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base App Tile (Squircle with sleek border) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#2f3240" stroke-width="4" filter="url(#dropShadow)" />

  <!-- House Gable (The "Casa" Roof) -->
  <path d="M 256 96 L 396 216 L 356 216 L 256 130 L 156 216 L 116 216 Z" fill="url(#roofGrad)" />

  <!-- Chimney / Flash Accent -->
  <rect x="330" y="118" width="28" height="46" rx="6" fill="#f59e0b" />

  <!-- Outer Camera Lens Ring -->
  <circle cx="256" cy="300" r="140" fill="none" stroke="#2a2d3a" stroke-width="18" />
  <circle cx="256" cy="300" r="124" fill="url(#irisCenter)" stroke="url(#roofGrad)" stroke-width="6" />

  <!-- Camera Aperture Iris Blades (The "Photo" Aperture) -->
  <g transform="translate(256, 300)">
    <!-- Blade 1 -->
    <path d="M 0 -95 L 42 -75 L -10 -40 Z" fill="#f59e0b" opacity="0.95" />
    <!-- Blade 2 -->
    <path d="M 0 -95 L 42 -75 L -10 -40 Z" fill="#ea580c" opacity="0.95" transform="rotate(60)" />
    <!-- Blade 3 -->
    <path d="M 0 -95 L 42 -75 L -10 -40 Z" fill="#dc2626" opacity="0.95" transform="rotate(120)" />
    <!-- Blade 4 -->
    <path d="M 0 -95 L 42 -75 L -10 -40 Z" fill="#ea580c" opacity="0.95" transform="rotate(180)" />
    <!-- Blade 5 -->
    <path d="M 0 -95 L 42 -75 L -10 -40 Z" fill="#f59e0b" opacity="0.95" transform="rotate(240)" />
    <!-- Blade 6 -->
    <path d="M 0 -95 L 42 -75 L -10 -40 Z" fill="#fbbf24" opacity="0.95" transform="rotate(300)" />
    <!-- Inner Lens Aperture Opening -->
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="#0b0f19" stroke="#f59e0b" stroke-width="3" />
    <circle cx="-12" cy="-14" r="8" fill="#ffffff" opacity="0.35" />
  </g>
</svg>
